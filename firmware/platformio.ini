[platformio]
default_envs = cardputer_adv

[env:cardputer_adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --no-stub
build_flags =
    -DESP32S3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DDEVICE_LINK_FIRMWARE_VERSION=\"0.1.0\"
build_src_filter =
    +<*>
    -<bringup_main.cpp>
    -<bringup_protocol.cpp>
lib_deps =
    m5stack/M5Unified@0.2.18
    m5stack/M5GFX@0.2.25
    bblanchon/ArduinoJson@7.4.2
    z3t0/IRremote@4.7.1
    https://github.com/m5stack/M5Cardputer.git#1.2.0

[env:cardputer_adv_bringup]
extends = env:cardputer_adv
build_flags =
    ${env:cardputer_adv.build_flags}
    -DM1_BRINGUP_FIRMWARE_VERSION=\"0.1.3\"
build_src_filter =
    +<bringup_main.cpp>
    +<bringup_protocol.cpp>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<bringup_protocol.cpp>
    +<controller_state.cpp>
    +<device_link.cpp>
    -<main.cpp>
    -<bringup_main.cpp>
build_flags =
    -std=c++17
lib_deps =
    bblanchon/ArduinoJson@7.4.2
